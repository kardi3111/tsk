<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Zadań, Kar i Rygoru Solo</title>
  <style>
    body {
      background-color: #0a060d;
      color: #f3e9f5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #e02585; text-transform: uppercase; font-size: 1.5rem; text-align: center; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
    .card { background: #1a0f1f; border: 1px solid #b45096; border-radius: 8px; padding: 15px; }
    .btn { width: 100%; padding: 12px; background: #8b12a8; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; text-transform: uppercase; }
    .btn:hover { background: #e02585; }
    .btn-danger { background: #d92525; }
    select, input { width: 100%; padding: 8px; margin-top: 5px; background: #0a060d; color: #fff; border: 1px solid #b45096; border-radius: 4px; }
    .result-box { background: #0a060d; border: 1px dashed #e02585; padding: 15px; border-radius: 6px; margin-top: 10px; min-height: 80px; text-align: center; }
    .timer { font-size: 1.8rem; color: #dfb256; text-align: center; font-family: monospace; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>Generator Zadań, Kar i Rygoru Solo</h1>

  <div class="container">
    <div class="card">
      <label>Kategoria Wyzwania:</label>
      <select id="categorySelect">
        <option value="ALL">Wszystkie Kategorie</option>
        <option value="feminizacja">Sukienki i Feminizacja</option>
        <option value="sensoryka">Sensoryka i Bezruch</option>
        <option value="postawa">Postawa i Szpilki</option>
        <option value="sluzbalczosc">Służalczość i Porządki</option>
      </select>

      <label style="display:block; margin-top:10px; color:#ff8080;">
        <input type="checkbox" id="extremeRigor"> Tryb "Bezwzględny Rygor" (Liczba klapsów x3)
      </label>

      <button class="btn" id="spinBtn" style="margin-top:15px;">Wylosuj Zadanie</button>
      <button class="btn btn-danger" id="drawPenaltyBtn">Wylosuj Karę za Błąd (20 Kar)</button>
      <button class="btn" style="background:#dfb256; color:#000;" id="generateOutfitBtn">Wygeneruj Strój</button>
    </div>

    <div class="card">
      <h3>Wynik Losowania:</h3>
      <div class="result-box">
        <div id="resCategory" style="color: #dfb256; font-size: 0.8rem; text-transform: uppercase;">Gotowy</div>
        <div id="resText" style="margin-top: 8px; font-size: 1.05rem; line-height: 1.4;">Kliknij przycisk powyżej, aby rozpocząć.</div>
        <div id="modifierDisplay" style="color: #e02585; margin-top: 10px; font-size: 0.85rem; font-weight: bold;"></div>
      </div>
    </div>

    <div class="card">
      <h3>Stoper Odliczający</h3>
      <div class="timer" id="timerDisplay">15:00</div>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="startTimer">Start</button>
        <button class="btn" style="background:#555;" id="resetTimer">Reset</button>
      </div>
    </div>

    <div class="card">
      <h3>Wylosowany Strój:</h3>
      <ul id="outfitBox" style="font-size: 0.9rem; padding-left: 20px; line-height: 1.6;">
        <li>Brak wygenerowanego stroju.</li>
      </ul>
    </div>
  </div>

        "chodzenie powolnym krokiem z rękami skutymi do pas/obroży",

      // 20 Kar za nieposłuszeństwo
      const penalties = [
        "KARA #1: Natychmiastowe 50 klapsów narzędziem: czarna packa ze skutymi rękami na plecach.",

      function buildTaskText(category, i) {
        const br = bras[i % bras.length];
        const pan = panties[i % panties.length];
        const low = lowerLayers[i % lowerLayers.length];
        const dr = dresses[i % dresses.length];
        const col = collars[i % collars.length];
        const sc = scarfCounts[i % scarfCounts.length];
        const clamp = clampsTypes[i % clampsTypes.length];
        const tool = spankingTools[i % spankingTools.length];
        const ex = exerciseTypes[i % exerciseTypes.length];

        const hasClaps = (i % 2 === 0);
        const hasCuffs = (i % 3 === 0 || i % 5 === 0);

        let text = "";
        let cuffText = hasCuffs ? " Ręce zakute w kajdanki na plecach, kostki spięte paskiem." : "";

        if (category === "feminizacja") {
          text = `Załóż ${br}, ${pan}, ${low} oraz ${dr}. Obroża: ${col}, dodatek: ${sc}, zamocuj na piersiach: ${clamp}.${cuffText} Wykonaj serię eleganckich ukłonów przed lustrem.`;

          text = `Ubrana w ${br}, ${pan}, ${low}, ${dr}, obrożę: ${col}, ${sc}, opaskę na oczy (blindfold) oraz ${clamp}.${cuffText} Wytrzymaj w całkowitym bezruchu na krześle.`;

          text = `Ubrana w ${br}, ${pan}, ${low}, ${dr}, obrożę: ${col}, ${sc} i ${clamp}.${cuffText} Wykonaj dokładne polerowanie obuwia lub czyszczenie na kolanach.`;
        }

        if (hasClaps) {
          text += ` Na zakończenie wymierz sobie {{CLAPS_PLACEHOLDER}} klapsów narzędziem: ${tool}.`;
        }

        return { category, text, hasClaps, baseClaps: clapCounts[i % clapCounts.length] };
      }

      const tasks = [
        ...Array.from({length: 25}, (_, i) => buildTaskText("feminizacja", i)),
        ...Array.from({length: 25}, (_, i) => buildTaskText("sensoryka", i)),
        ...Array.from({length: 25}, (_, i) => buildTaskText("postawa", i)),
        ...Array.from({length: 25}, (_, i) => buildTaskText("sluzbalczosc", i))
      ];

      const pick = arr => arr[Math.floor(Math.random() * arr.length)];

      document.getElementById("spinBtn").onclick = function() {
        const cat = document.getElementById("categorySelect").value;
        const filtered = cat === "ALL" ? tasks : tasks.filter(t => t.category === cat);
        const task = filtered[Math.floor(Math.random() * filtered.length)];

        const isExtreme = document.getElementById("extremeRigor").checked;
        const claps = isExtreme ? task.baseClaps * 3 : task.baseClaps;

        let finalText = task.text;
        if (task.hasClaps) {
          finalText = finalText.replace("{{CLAPS_PLACEHOLDER}}", claps);
        }

        document.getElementById("resCategory").innerText = "Wylosowane Zadanie (" + task.category.toUpperCase() + ")";
        document.getElementById("resText").innerText = finalText;
        document.getElementById("modifierDisplay").innerText = pick(modifiers);
      };

      document.getElementById("drawPenaltyBtn").onclick = function() {
        document.getElementById("resCategory").innerText = "KARA ZA NIEPOSŁUSZEŃSTWO";
        document.getElementById("resText").innerText = pick(penalties);
        document.getElementById("modifierDisplay").innerText = "";
      };

      document.getElementById("generateOutfitBtn").onclick = function() {
        document.getElementById("outfitBox").innerHTML = `
          <li><strong>Obroża:</strong> ${pick(collars)}</li>
          <li><strong>Góra (Bielizna):</strong> ${pick(bras)}</li>
          <li><strong>Dół (Bielizna):</strong> ${pick(panties)}</li>
          <li><strong>Nogi:</strong> ${pick(lowerLayers)}</li>
          <li><strong>Główny Strój:</strong> ${pick(dresses)}</li>
          <li><strong>Szaliki:</strong> ${pick(scarfCounts)}</li>
          <li><strong>Zaciski/Klamry:</strong> ${pick(clampsTypes)}</li>
          <li><strong>Narzędzie do klapsów:</strong> ${pick(spankingTools)}</li>
        `;
      };

      let timer = 900;
      let interval = null;
      const display = document.getElementById("timerDisplay");

      document.getElementById("startTimer").onclick = function() {
        if (interval) return;
        interval = setInterval(() => {
          if (timer > 0) {
            timer--;
            let m = Math.floor(timer / 60).toString().padStart(2, '0');
            let s = (timer % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
          } else {
            clearInterval(interval);
            interval = null;
            alert("Czas zadania minął!");
          }
        }, 1000);
      };

      document.getElementById("resetTimer").onclick = function() {
        clearInterval(interval);
        interval = null;
        timer = 900;
        display.innerText = "15:00";
      };
    };
  </script>

</body>
</html>
