<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Zadań, Kar i Rygoru Solo (300 Zadań + 30 Kar)</title>
  <style>
    :root {
      --bg-main: #0a060d;
      --bg-card: rgba(26, 15, 31, 0.85);
      --border-card: rgba(180, 80, 150, 0.25);
      --accent-magenta: #e02585;
      --accent-purple: #8b12a8;
      --accent-gold: #dfb256;
      --accent-red: #d92525;
      --text-main: #f3e9f5;
      --text-muted: #a692ab;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 18, 168, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(224, 37, 133, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 25px; }

    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-magenta);
      text-shadow: 0 0 12px rgba(224, 37, 133, 0.4);
      margin-bottom: 8px;
    }

    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }

    @media (min-width: 900px) {
      .container { grid-template-columns: 320px 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-card);
      padding-bottom: 8px;
    }

    .filter-group { margin-bottom: 15px; }
    .filter-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      background: rgba(10, 6, 13, 0.8);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
      color: white;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(224, 37, 133, 0.3);
      margin-bottom: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-card);
      color: var(--text-muted);
      box-shadow: none;
    }

    .btn-danger {
      background: linear-gradient(135deg, #800000, var(--accent-red));
      box-shadow: 0 4px 12px rgba(217, 37, 37, 0.4);
      color: white;
    }

    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    canvas#wheel {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(139, 18, 168, 0.4);
      margin-bottom: 15px;
      transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
    }

    .pointer {
      position: absolute;
      top: 5px;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid var(--accent-gold);
      z-index: 10;
    }

    .result-box {
      background: rgba(10, 6, 13, 0.9);
      border: 1px dashed var(--accent-magenta);
      border-radius: 8px;
      padding: 20px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin-top: 15px;
    }

    .result-category {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
